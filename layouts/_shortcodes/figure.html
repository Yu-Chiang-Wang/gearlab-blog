{{- /* 覆寫 Hugo 內建 figure：維持原本的 <figure>/<figcaption> 結構，
       但圖片本體改走 responsive-image（WebP + srcset + width/height）。
       站上文章目前只用到 src / alt / caption 三個參數。 */ -}}
<figure{{ with .Get "class" }} class="{{ . }}"{{ end }}>
  {{- with .Get "link" }}<a href="{{ . }}"{{ with $.Get "target" }} target="{{ . }}"{{ end }}{{ with $.Get "rel" }} rel="{{ . }}"{{ end }}>{{ end -}}
  {{- partial "responsive-image.html" (dict
        "src" (.Get "src")
        "alt" (.Get "alt")
        "title" (.Get "title")
        "loading" (.Get "loading" | default "lazy")
  ) -}}
  {{- if .Get "link" }}</a>{{ end -}}
  {{- if or (.Get "title") (.Get "caption") (.Get "attr") }}
  <figcaption>
    {{- with .Get "title" }}<h4>{{ . }}</h4>{{ end -}}
    {{- if or (.Get "caption") (.Get "attr") }}<p>
      {{- .Get "caption" | markdownify -}}
      {{- with .Get "attrlink" }} <a href="{{ . }}">{{ end -}}
      {{- .Get "attr" | markdownify -}}
      {{- if .Get "attrlink" }}</a>{{ end -}}
    </p>{{ end -}}
  </figcaption>
  {{- end }}
</figure>
