{{- /* GA4 affiliate outbound-click tracking. Fires `affiliate_click` on any
       Shopee link so the monetization funnel (session → affiliate click) is
       measurable in GA4. Uses event delegation so DOM readiness is irrelevant. */ -}}
<script>
(function () {
  var AFFILIATE_HOSTS = ['s.shopee.tw', 'shopee.tw'];
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var host;
    try { host = new URL(a.href).hostname; } catch (err) { return; }
    var isAffiliate = AFFILIATE_HOSTS.some(function (h) {
      return host === h || host.endsWith('.' + h);
    });
    if (!isAffiliate) return;
    if (typeof gtag !== 'function') return;
    gtag('event', 'affiliate_click', {
      link_url: a.href,
      link_text: (a.textContent || '').trim().slice(0, 100),
      page_path: location.pathname,
      affiliate_network: 'shopee'
    });
  }, true);
})();
</script>
